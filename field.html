<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIRUIKONG</title>
  <meta name="description" content="A dedicated KZR field page for a selected area of inquiry.">
  <link rel="icon" type="image/png" href="/assets/favicon-kzr.png?v=2">
  <link rel="apple-touch-icon" href="/assets/favicon-kzr.png?v=2">
  <link rel="stylesheet" href="cookie-consent.css">
  <style>
    :root {
      --ink: #111827;
      --navy: #0b1831;
      --muted: #6f6a62;
      --line: rgba(11, 24, 49, 0.12);
      --paper: #f6efe3;
      --panel: #fbf7f0;
      --gold: #b99254;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 82% 14%, rgba(255,255,255,0.75), transparent 20%),
        linear-gradient(180deg, rgba(255,255,255,0.3), rgba(246,239,227,1));
      color: var(--ink);
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 24px 28px 0;
      background: linear-gradient(180deg, rgba(246,239,227,0.94), rgba(246,239,227,0));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      width: 128px;
      height: auto;
      display: block;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .top-links a {
      color: rgba(11, 24, 49, 0.8);
      text-decoration: none;
      transition: color 180ms ease;
    }

    .top-links a:hover {
      color: var(--navy);
    }

    main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 44px 30px 72px;
    }

    .field-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 620px;
      gap: clamp(36px, 5vw, 96px);
      align-items: start;
      min-height: calc(100vh - 120px);
    }

    .field-copy {
      padding-top: 26px;
    }

    .field-label {
      margin: 0 0 16px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .field-title {
      margin: 0;
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: clamp(56px, 8vw, 126px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .field-divider {
      width: 68px;
      height: 1px;
      margin: 26px 0 24px;
      background: linear-gradient(90deg, var(--gold), rgba(185,146,84,0));
    }

    .field-summary {
      max-width: 640px;
      margin: 0 0 28px;
      color: #39342f;
      font-size: 20px;
      line-height: 1.7;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 620px;
    }

    .field-card {
      min-height: 138px;
      padding: 18px 18px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,0.42);
      box-shadow: 0 18px 40px rgba(17,24,39,0.05);
    }

    .field-card strong {
      display: block;
      margin-bottom: 12px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--navy);
    }

    .field-card span {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .field-visual {
      position: sticky;
      top: 106px;
    }

    .field-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 0.92;
      overflow: hidden;
      border-radius: 36px;
      background: var(--panel);
      box-shadow:
        0 40px 100px rgba(17,24,39,0.12),
        0 0 0 1px rgba(11, 24, 49, 0.05) inset;
    }

    .field-frame::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.56);
      z-index: 2;
      pointer-events: none;
    }

    .field-image {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: saturate(0.98) contrast(1.03);
    }

    .field-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,0.2), transparent 22%),
        linear-gradient(180deg, rgba(255,255,255,0.05), transparent 30%, transparent 70%, rgba(0,0,0,0.18));
    }

    .field-caption {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 28px;
      z-index: 3;
      color: #fffaf4;
      text-shadow: 0 10px 28px rgba(0,0,0,0.26);
    }

    .field-caption strong {
      display: block;
      margin-bottom: 8px;
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: 36px;
      line-height: 0.94;
      font-weight: 900;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }

    .field-caption span {
      display: block;
      max-width: 290px;
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 1024px) {
      .field-shell {
        grid-template-columns: 1fr;
      }

      .field-visual {
        position: relative;
        top: auto;
      }
    }

    @media (max-width: 640px) {
      .site-header {
        padding: 18px 18px 0;
      }

      main {
        padding: 28px 18px 54px;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      .field-title {
        font-size: clamp(42px, 14vw, 74px);
      }

      .field-caption strong {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html#inquiry" aria-label="Back to home">
        <img src="assets/kzr-home-logo.png" alt="KZR logo">
      </a>
      <nav class="top-links" aria-label="Field navigation">
        <a href="index.html#inquiry">Home</a>
        <a href="about.html">About</a>
        <a href="shop.html">Shop</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="field-shell" aria-label="Field detail">
      <div class="field-copy">
        <p class="field-label">Field of Inquiry</p>
        <h1 class="field-title" id="fieldTitle">Economics</h1>
        <div class="field-divider" aria-hidden="true"></div>
        <p class="field-summary" id="fieldSummary"></p>
        <div class="field-grid" id="fieldGrid"></div>
      </div>

      <aside class="field-visual" aria-label="Field image">
        <div class="field-frame">
          <div class="field-image" id="fieldImage"></div>
          <div class="field-caption">
            <strong id="fieldCaptionTitle">Economics</strong>
            <span id="fieldCaptionText"></span>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const fieldLibrary = {
      economics: {
        title: "Economics",
        summary: "A field for studying incentives, coordination, exchange, and the institutional structures that shape human choice at scale.",
        caption: "Markets, incentives, and institutional behavior.",
        image: "linear-gradient(180deg, rgba(48,36,17,0.12), rgba(18,11,7,0.28)), url('assets/kid-hero-bg-warm.png')",
        position: "52% 44%",
        cards: [
          ["Current angle", "Decision-making, market structure, and long-run development systems."],
          ["Methods", "Modeling, comparative reasoning, and evidence-based interpretation."],
          ["Questions", "How incentives reshape learning, work, and institutional outcomes."],
          ["Why it matters", "It gives structure to tradeoffs, policy logic, and durable strategic thinking."]
        ]
      },
      mathematics: {
        title: "Mathematics",
        summary: "A field for exact structure, abstraction, proof, and the disciplined reduction of complex ideas into clean logical forms.",
        caption: "Structure, proof, abstraction, and exact reasoning.",
        image: "linear-gradient(180deg, rgba(18,24,34,0.08), rgba(12,18,28,0.22)), url('assets/kid-hero-bg.png')",
        position: "54% 38%",
        cards: [
          ["Current angle", "Foundational structure, pattern recognition, and formal reasoning."],
          ["Methods", "Proof, symbolic clarity, and careful decomposition of problems."],
          ["Questions", "What hidden order underlies complex systems and quantitative claims."],
          ["Why it matters", "It sharpens precision and gives rigor to every adjacent field."]
        ]
      },
      statistics: {
        title: "Statistics",
        summary: "A field for inference under uncertainty, data interpretation, and the careful distinction between signal, noise, and confidence.",
        caption: "Inference, uncertainty, evidence, and data judgment.",
        image: "linear-gradient(180deg, rgba(13,31,52,0.12), rgba(6,15,30,0.28)), url('assets/kid-hero-bg-studio.png')",
        position: "45% 36%",
        cards: [
          ["Current angle", "Evidence quality, model fit, and probabilistic reasoning."],
          ["Methods", "Inference, estimation, and disciplined reading of data."],
          ["Questions", "How to tell when patterns are meaningful and when they mislead."],
          ["Why it matters", "It grounds judgment in uncertainty rather than false certainty."]
        ]
      },
      computing: {
        title: "Computing",
        summary: "A field for implementation, systems thinking, and building structured tools that turn abstract reasoning into working environments.",
        caption: "Systems thinking, implementation, and computational design.",
        image: "linear-gradient(180deg, rgba(18,26,44,0.1), rgba(6,13,22,0.34)), url('assets/kid-hero-bg.png')",
        position: "58% 42%",
        cards: [
          ["Current angle", "Interfaces, automation, and information architecture."],
          ["Methods", "Code, iteration, debugging, and compositional systems design."],
          ["Questions", "How to build environments that support thinking, memory, and output."],
          ["Why it matters", "It turns conceptual systems into tools you can actually live inside."]
        ]
      },
      "machine-learning": {
        title: "Machine Learning",
        summary: "A field for modeling patterns from data, optimizing predictive systems, and exploring how intelligent tools can extend human workflows.",
        caption: "Models, optimization, and intelligent workflows.",
        image: "linear-gradient(180deg, rgba(22,33,56,0.14), rgba(7,13,26,0.36)), url('assets/kid-hero-bg-studio.png')",
        position: "50% 34%",
        cards: [
          ["Current angle", "Applied models, intelligent agents, and learning workflows."],
          ["Methods", "Training, evaluation, prompting, and system integration."],
          ["Questions", "How machine reasoning can amplify research, writing, and planning."],
          ["Why it matters", "It sits at the intersection of theory, automation, and capability."]
        ]
      },
      finance: {
        title: "Finance",
        summary: "A field for capital allocation, valuation, risk, and the disciplined understanding of how resources move through time and uncertainty.",
        caption: "Capital, valuation, risk, and strategic allocation.",
        image: "linear-gradient(180deg, rgba(56,42,19,0.12), rgba(20,12,7,0.28)), url('assets/kid-hero-bg-warm.png')",
        position: "58% 46%",
        cards: [
          ["Current angle", "Allocation, valuation logic, and long-horizon judgment."],
          ["Methods", "Scenario analysis, risk framing, and comparative reasoning."],
          ["Questions", "How time, uncertainty, and incentives reshape strategic choices."],
          ["Why it matters", "It adds discipline to growth, opportunity, and downside awareness."]
        ]
      },
      "political-science": {
        title: "Political Science",
        summary: "A field for governance, power, institutions, and the structures through which collective decisions become social reality.",
        caption: "Power, governance, decision systems, and public order.",
        image: "linear-gradient(180deg, rgba(33,27,21,0.12), rgba(15,11,10,0.28)), url('assets/kid-hero-bg-warm.png')",
        position: "47% 42%",
        cards: [
          ["Current angle", "Institutions, legitimacy, and strategic behavior in public systems."],
          ["Methods", "Comparative analysis, case reading, and structural interpretation."],
          ["Questions", "How authority, design, and incentives shape collective outcomes."],
          ["Why it matters", "It connects individual strategy to institutional and historical force."]
        ]
      }
    };

    const params = new URLSearchParams(window.location.search);
    const subject = params.get("subject");
    const activeField = fieldLibrary[subject] || fieldLibrary.economics;

    document.title = `ZIRUIKONG - ${activeField.title}`;
    document.getElementById("fieldTitle").textContent = activeField.title;
    document.getElementById("fieldSummary").textContent = activeField.summary;
    document.getElementById("fieldCaptionTitle").textContent = activeField.title;
    document.getElementById("fieldCaptionText").textContent = activeField.caption;

    const imageNode = document.getElementById("fieldImage");
    imageNode.style.backgroundImage = activeField.image;
    imageNode.style.backgroundPosition = activeField.position;

    document.getElementById("fieldGrid").innerHTML = activeField.cards.map(([label, body]) => `
      <article class="field-card">
        <strong>${label}</strong>
        <span>${body}</span>
      </article>
    `).join("");
  </script>
  <script src="cookie-consent.js" defer></script>
</body>
</html>
