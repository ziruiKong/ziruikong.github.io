<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIRUI KONG'S WEBSITE — Video</title>
  <meta name="description" content="A curated video library for talks, demos, lectures, and visual notes.">
  <link rel="icon" type="image/png" href="assets/favicon-kzr.png">
  <style>
    :root{--bg:#f7f3ea;--panel:#fffdf8;--ink:#111820;--muted:#6d675e;--line:#11182022;--navy:#101820;--gold:#b89455}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .top{position:sticky;top:0;z-index:50;background:rgba(247,243,234,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .top-inner{width:100%;padding:12px 24px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}.brand img{width:80px;filter:brightness(0);display:block}
    .nav{display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap}.nav a{text-decoration:none;color:#241f19;opacity:.76;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.nav a.active,.nav a:hover{opacity:1}
    .hero{width:100%;padding:44px 24px 18px}.video-marquee{border:1px solid #cfd6dc;background:#eceae6;border-radius:16px;overflow:hidden}.video-track{display:flex;gap:62px;width:max-content;padding:12px 0;animation:video-scroll 54s linear infinite}.video-text{font-size:clamp(72px,13vw,190px);line-height:.84;font-weight:900;letter-spacing:-.05em;text-transform:uppercase;color:#151922;white-space:nowrap}.video-text.muted{color:#afb4b9}@keyframes video-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .toolbar{padding:0 24px 14px;display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:10px}.input,.select{width:100%;border:1px solid var(--line);background:#fff;padding:12px 13px;font-size:14px}.select{font-size:12px;letter-spacing:.1em;text-transform:uppercase}.section{width:100%;padding:0 24px 56px}.panel{background:var(--panel);border:1px solid var(--line);padding:18px}.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}.head h1{margin:0;font-size:clamp(28px,4vw,52px);letter-spacing:-.035em;text-transform:uppercase}.count{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:12px}
    .video-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.video-card{display:grid;grid-template-rows:auto 1fr;background:#fff;border:1px solid var(--line);min-width:0;overflow:hidden;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}.video-card:hover{transform:translateY(-4px);box-shadow:0 20px 48px rgba(16,24,32,.16);border-color:#10182066}.video-frame{position:relative;aspect-ratio:16/9;background:#0d1420;overflow:hidden}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.video-placeholder{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#101820,#273447);color:#f7f3ea;font-size:12px;letter-spacing:.14em;text-transform:uppercase}.video-body{padding:13px;border-top:1px solid var(--line)}.video-title{margin:0 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.12;font-weight:400}.video-meta{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #1113;padding:4px 7px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#40382f}.episode-picker{display:none;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:#f8f3e9}.episode-picker.show{display:grid}.episode-buttons{display:flex;flex-wrap:wrap;gap:8px}.episode-btn{border:1px solid #1113;background:#fff;padding:8px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:850;cursor:pointer}.episode-btn.active{background:#101820;color:#fffdf8;border-color:#101820}.episode-manual{display:grid;grid-template-columns:auto 92px minmax(150px,1fr) auto;gap:8px;align-items:center}.episode-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;color:var(--muted)}.episode-input{width:100%;border:1px solid #1113;background:#fff;padding:9px 10px;font-size:12px}.episode-apply{border:1px solid #1113;background:#101820;color:#fffdf8;padding:9px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;cursor:pointer}@media (max-width:640px){.episode-manual{grid-template-columns:1fr 1fr}.episode-label{grid-column:1/-1}}.empty{display:none;padding:18px;border:1px dashed #1114;background:#fff;color:var(--muted)}.empty.show{display:block}.video-modal{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:clamp(18px,4vw,54px);background:rgba(7,12,18,.45);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%)}.video-modal.is-open{display:grid}.modal-card{width:min(1180px,94vw);background:#fffdf8;border:1px solid rgba(255,255,255,.42);box-shadow:0 36px 100px rgba(0,0,0,.35);display:grid;gap:0}.modal-frame{position:relative;aspect-ratio:16/9;background:#0d1420}.modal-frame iframe{position:absolute;inset:0;width:100%;height:100%;display:block}.modal-info{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}.modal-title{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.15;font-weight:400}.modal-close{border:1px solid #1113;background:#fff;padding:10px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;cursor:pointer}
    @media (max-width:1180px){.video-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:820px){.toolbar{grid-template-columns:1fr}.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:560px){.video-grid{grid-template-columns:1fr}.hero,.toolbar,.section{padding-left:16px;padding-right:16px}}
  </style>
  <link rel="stylesheet" href="global-loader.css?v=20260526">
</head>
<body>
  <header class="top"><div class="top-inner"><a class="brand" href="index.html#home" aria-label="KZR Home"><img src="assets/kzr-logo-black.png" alt="KZR logo"></a><nav class="nav" aria-label="Video navigation"><a href="index.html#home">Home</a><a href="phd-catalog.html">Catalog</a><a class="active" href="video.html">Video</a><a href="blog.html">Blog</a><a href="resources.html">Archive</a><a href="paper-library.html">Paper</a><a href="notes.html">Notes</a><a href="materials.html">Materials</a></nav></div></header>
  <section class="hero" aria-label="Video hero"><div class="video-marquee" aria-label="Video marquee"><div class="video-track"><span class="video-text">Video ✶</span><span class="video-text muted">Library ✶</span><span class="video-text">Video ✶</span><span class="video-text muted">Library ✶</span></div></div></section>
  <section class="toolbar" aria-label="Video filters"><input class="input" id="videoSearch" type="search" placeholder="Search title, source, or tag"><select class="select" id="videoFilter" aria-label="Video category filter"><option value="all">All Types</option></select></section>
  <main class="section"><section class="panel" aria-label="Video library"><div class="head"><h1>Library</h1><span class="count" id="videoCount">[00]</span></div><div class="video-grid" id="videoGrid"></div><div class="empty" id="emptyState">No matching videos.</div></section></main>
  <div class="video-modal" id="videoModal" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-label="Expanded video"><div class="modal-frame" id="modalFrame"></div><div class="episode-picker" id="episodePicker" aria-label="Episode selector"></div><div class="modal-info"><h2 class="modal-title" id="modalTitle"></h2><button class="modal-close" id="modalClose" type="button">Close</button></div></div></div>
  <script>
    const videos=[
      // Bilibili 多 P/选集：弹窗里会显示 P1-P12 快捷按钮，也可以手动输入 page/cid 改嵌入参数。
      // 如需自定义按钮名称或固定 cid，可添加 episodes:[{label:'Intro',page:1,cid:'...'}, {label:'Lecture 2',page:2}]。
      {title:'Introduction to Statistics and Data Analysis',source:'Bilibili',type:'Course',tags:['statistics','data analysis','course'],aid:'115678099014832',bvid:'BV1w1mcBtEKU',cid:'34571226129',page:1},
      {title:'Probability Theory and Statistics',source:'Bilibili',type:'Course',tags:['probability','statistics','course'],aid:'115054724849003',bvid:'BV1E3eAzGEQq',cid:'31799706397',page:1},
      {title:'Khan Academy: Statistics',source:'Bilibili',type:'Course',tags:['khan academy','statistics','course'],aid:'886721012',bvid:'BV1DK4y1n7J8',cid:'297342958',page:1},
      {title:'Statistics',source:'Bilibili',type:'Course',tags:['statistics','course'],aid:'800866157',bvid:'BV1sy4y1e7Eg',cid:'280405696',page:1}
    ];
    const grid=document.getElementById('videoGrid'), search=document.getElementById('videoSearch'), filter=document.getElementById('videoFilter'), count=document.getElementById('videoCount'), empty=document.getElementById('emptyState'), modal=document.getElementById('videoModal'), modalFrame=document.getElementById('modalFrame'), episodePicker=document.getElementById('episodePicker'), modalTitle=document.getElementById('modalTitle'), modalClose=document.getElementById('modalClose');
    let activeVideo=null, activeEpisode=null;const quickEpisodePages=Array.from({length:12},(_,i)=>i+1);
    [...new Set(videos.map(v=>v.type))].sort().forEach(t=>filter.insertAdjacentHTML('beforeend',`<option value="${t}">${t}</option>`));
    function getEpisodes(video){const page=video.page||1;const base={label:`P${page}`,page,cid:page===1?video.cid:undefined};return video.episodes?.length?video.episodes: [base]}
    function getPickerEpisodes(video){const configured=getEpisodes(video);const byPage=new Map(configured.map(ep=>[Number(ep.page)||1,ep]));quickEpisodePages.forEach(page=>{if(!byPage.has(page))byPage.set(page,{label:`P${page}`,page})});return [...byPage.values()].sort((a,b)=>(Number(a.page)||1)-(Number(b.page)||1))}
    function getEpisodeLabel(video){const episodes=video.episodes?.length?video.episodes:getEpisodes(video);if(episodes.length>1)return `${episodes.length} Parts`;return `P${episodes[0].page||1}`}
    function bilibiliSrc(video,episode={}){const page=Number(episode.page)||video.page||1;const cid=episode.cid;const params=new URLSearchParams({isOutside:'true',aid:video.aid,bvid:video.bvid,page:String(page),p:String(page),high_quality:'1',danmaku:'0',autoplay:'0'});if(cid)params.set('cid',cid);return `//player.bilibili.com/player.html?${params.toString()}`}
    function bilibiliEmbed(video,episode={}){const src=bilibiliSrc(video,episode);return `<iframe src="${src}" allowfullscreen="allowfullscreen" width="100%" height="500" scrolling="no" frameborder="0" loading="lazy" sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts"></iframe>`}
    function renderEpisodePicker(){const episodes=getPickerEpisodes(activeVideo);const currentPage=Number(activeEpisode?.page)||1;episodePicker.innerHTML=`<div class="episode-buttons">${episodes.map((ep,i)=>`<button class="episode-btn${Number(ep.page)===currentPage?' active':''}" type="button" data-episode-index="${i}">${ep.label||`P${ep.page||i+1}`}</button>`).join('')}</div><form class="episode-manual"><span class="episode-label">Manual embed</span><input class="episode-input" name="page" type="number" min="1" step="1" value="${currentPage}" aria-label="Bilibili page number"><input class="episode-input" name="cid" type="text" value="${activeEpisode?.cid||''}" placeholder="Optional cid" aria-label="Optional Bilibili cid"><button class="episode-apply" type="submit">Apply</button></form>`;episodePicker.classList.add('show')}
    function selectEpisode(index){const episodes=getPickerEpisodes(activeVideo);activeEpisode=episodes[index]||episodes[0];modalFrame.innerHTML=bilibiliEmbed(activeVideo,activeEpisode);renderEpisodePicker()}
    function applyManualEpisode(page,cid=''){activeEpisode={label:`P${page}`,page,cid:cid.trim()||undefined};modalFrame.innerHTML=bilibiliEmbed(activeVideo,activeEpisode);renderEpisodePicker()}
    function openVideo(video){if(!video.aid)return;activeVideo=video;modalTitle.textContent=video.title;selectEpisode(0);modal.classList.add('is-open');modal.setAttribute('aria-hidden','false')}
    function closeVideo(){modal.classList.remove('is-open');modal.setAttribute('aria-hidden','true');modalFrame.innerHTML='';episodePicker.innerHTML='';episodePicker.classList.remove('show');activeVideo=null;activeEpisode=null}
    function render(){const q=search.value.trim().toLowerCase();const filtered=videos.filter(v=>(filter.value==='all'||v.type===filter.value)&&(!q||[v.title,v.source,v.type,...v.tags].join(' ').toLowerCase().includes(q)));grid.innerHTML=filtered.map((v,i)=>`<article class="video-card" data-video-index="${videos.indexOf(v)}" tabindex="0"><div class="video-frame">${bilibiliEmbed(v,getEpisodes(v)[0])}</div><div class="video-body"><h2 class="video-title">${v.title}</h2><div class="video-meta"><span class="chip">${v.source}</span><span class="chip">${v.type}</span><span class="chip">${getEpisodeLabel(v)}</span></div></div></article>`).join('');count.textContent=`[${String(filtered.length).padStart(2,'0')}]`;empty.classList.toggle('show',!filtered.length)}
    grid.addEventListener('click',e=>{const card=e.target.closest('.video-card');if(card)openVideo(videos[Number(card.dataset.videoIndex)])});
    grid.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const card=e.target.closest('.video-card');if(card){e.preventDefault();openVideo(videos[Number(card.dataset.videoIndex)])}});
    modal.addEventListener('click',e=>{if(e.target===modal)closeVideo()});episodePicker.addEventListener('click',e=>{const btn=e.target.closest('.episode-btn');if(btn)selectEpisode(Number(btn.dataset.episodeIndex))});episodePicker.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);applyManualEpisode(Math.max(1,Number(data.get('page'))||1),String(data.get('cid')||''))});modalClose.addEventListener('click',closeVideo);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});
    [search,filter].forEach(el=>el.addEventListener(el===search?'input':'change',render));render();
  </script>
  <script src="global-loader.js?v=20260526" defer></script>
</body>
