<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIRUI KONG'S WEBSITE — Catalog</title>
  <meta name="description" content="Advanced PhD catalog with scalable project listing.">
  <link rel="icon" type="image/png" href="assets/favicon-kzr.png">
  <style>
    :root{--bg:#f6f1e6;--ink:#151515;--muted:#5f5a50;--line:#1a1a1a;--link:#241f19;--panel:#f2ede2;--accent:#9b4d21}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    a{color:var(--link);text-decoration:none}
    .top{position:sticky;top:0;z-index:50;background:rgba(246,241,230,.92);backdrop-filter:blur(10px);border-bottom:1px solid #201f1b22}
    .top-inner{width:100%;padding:12px 24px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
    .brand img{width:80px;filter:brightness(0);display:block}
    .nav{display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap}.nav a{text-decoration:none;color:#241f19;opacity:.76;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.nav a.active,.nav a:hover{opacity:1}

    .hero{width:100%;padding:24px 30px 0;background:var(--panel)}
    .hero-top{border-top:2px solid var(--line);padding-top:16px}
    .hero h1{margin:0;font-size:64px;line-height:.9;letter-spacing:-.03em;font-weight:600}
    .hero h1 .dot{color:var(--accent)}
    .hero p{margin:14px 0 10px;color:var(--muted);font-size:15px;max-width:780px}

    .search-wrap{background:var(--panel);padding:16px 30px 18px;border-bottom:2px solid var(--line)}
    .search-grid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center}
    .search-input,.search-select{height:42px;border:1.5px solid #1f1f1f;background:#f9f5eb;padding:0 12px;font-size:14px}
    .search-btn{height:42px;border:1.5px solid #1f1f1f;background:#151515;color:#f7f3ea;padding:0 18px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}

    .db-shell{background:var(--panel);padding:14px 30px 30px}
    .db-table{border:1.5px solid var(--line);overflow:hidden}
    .db-head{display:grid;grid-template-columns:1.05fr .4fr .8fr 1.15fr 1fr 1.2fr;gap:0;border-bottom:2px solid var(--line);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#3d3a33}
    .db-head span{padding:10px 12px;border-right:1.5px solid var(--line)}
    .db-head span:last-child{border-right:0}
    .db-row{display:grid;grid-template-columns:1.05fr .4fr .8fr 1.15fr 1fr 1.2fr;gap:0;align-items:stretch;border-bottom:1.5px solid var(--line);min-height:74px}
    .db-row:last-child{border-bottom:0}
    .db-cell{padding:12px;border-right:1.5px solid var(--line);display:flex;align-items:center;font-size:14px;line-height:1.35}
    .db-cell:last-child{border-right:0}
    .project-title{margin:0;font-size:14px;line-height:1.35;letter-spacing:0;font-weight:600}
    .project-title a{color:inherit;text-decoration:none}
    .project-title a:hover{text-decoration:underline}
    .meta{font-size:14px;font-weight:500;line-height:1.35}
    .db-cell a{font-size:14px;line-height:1.35;word-break:break-word}
    .status{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #1a1a1a;display:inline-block;padding:3px 8px}
    .tags{margin:7px 0 0;padding:0;list-style:none;display:flex;gap:6px;flex-wrap:wrap}
    .tags li{font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid #1f1f1f66;padding:2px 6px}

    @media (max-width:980px){
      .search-grid{grid-template-columns:1fr}
      .db-head{display:none}
      .db-table{border:0}
      .db-row{grid-template-columns:1fr;border:1.5px solid var(--line);margin-bottom:12px}
      .db-cell{border-right:0;border-bottom:1px solid var(--line)}
      .db-cell:last-child{border-bottom:0}
      .hero,.search-wrap,.db-shell{padding-left:20px;padding-right:20px}
      .hero h1{font-size:42px}
    }
  </style>
  <link rel="stylesheet" href="global-loader.css?v=20260526">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html#home" aria-label="KZR Home"><img src="assets/kzr-logo-black.png" alt="KZR logo"></a>
      <nav class="nav" aria-label="PhD catalog navigation">
        <a href="index.html#home">Home</a>
        <a href="about.html">About</a>
        <a href="resources.html">Archive</a>
        <a href="materials.html">Materials</a>
        <a class="active" href="phd-catalog.html">Catalog</a>
      </nav>
    </div>
  </header>

  <section class="hero" aria-label="PhD catalog hero">
    <div class="hero-top">
      <h1>Catalog<span class="dot">.</span></h1>
      <p>A growing inventory for dissertation ideas, proposal drafts, data pipelines, reading bundles, and field-building projects. Structured for scale as new items are continuously added.</p>
    </div>
  </section>

  <section class="search-wrap" aria-label="PhD catalog search">
    <div class="search-grid">
      <input id="q" class="search-input" type="search" placeholder="Search school, ranking, program, department, or keyword">
      <select id="field" class="search-select" aria-label="Theme filter"><option value="all">All Fields</option></select>
      <select id="prank" class="search-select" aria-label="Stage filter"><option value="all">All Program Ranks</option></select>
      <button id="searchBtn" class="search-btn" type="button">Search</button>
    </div>
  </section>

  <main class="db-shell" id="catalog">
    <div class="db-table">
      <div class="db-head"><span>学校</span><span>综排</span><span>专排</span><span>正式项目名称</span><span>所属院系 / Department</span><span>官网完整地址</span></div>
      <div id="rows"></div>
    </div>
  </main>

  <script>
    const DB = [
      {school:"University of Michigan",overall:"21",programRank:"Survey/Data Science Top 3",program:"PhD in Survey and Data Science",department:"Institute for Social Research",url:"https://surveysampling.isr.umich.edu/graduate/phd-in-survey-and-data-science/"},
      {school:"University of Washington",overall:"22",programRank:"Statistics #6",program:"PhD in Statistics",department:"Department of Statistics",url:"https://stat.uw.edu/academics/phd"},
      {school:"University of California, Los Angeles",overall:"24",programRank:"Statistics Top 15",program:"PhD in Statistics",department:"Department of Statistics and Data Science",url:"https://statistics.ucla.edu/graduate/ph-d-program/"},
      {school:"University of North Carolina at Chapel Hill",overall:"27",programRank:"Statistics/OR Top 20",program:"PhD in Statistics and Operations Research",department:"Department of Statistics and Operations Research",url:"https://stor.unc.edu/graduate/phd-program/"},
      {school:"University of California, San Diego",overall:"29",programRank:"CSS Top",program:"PhD Specialization in Computational Social Science",department:"Halıcıoğlu Data Science Institute",url:"https://css.ucsd.edu/graduate/index.html"},
      {school:"University of Wisconsin–Madison",overall:"30",programRank:"Statistics Top 15",program:"PhD in Statistics",department:"Department of Statistics",url:"https://stat.wisc.edu/graduate/phd-program/"},
      {school:"University of California, Davis",overall:"33",programRank:"Statistics Top 25",program:"PhD in Statistics",department:"Department of Statistics",url:"https://statistics.ucdavis.edu/grad/phd"},
      {school:"University of California, Irvine",overall:"35",programRank:"Statistics Top 20",program:"PhD in Statistics",department:"Department of Statistics",url:"https://www.stat.uci.edu/graduate/phd.php"},
      {school:"Boston University",overall:"39",programRank:"Statistics Top 25",program:"PhD in Statistics",department:"Department of Mathematics & Statistics",url:"https://www.bu.edu/stat/academics/phd-program/"},
      {school:"Boston College",overall:"39",programRank:"Quant Psych Top",program:"PhD in Measurement, Evaluation, Statistics and Assessment",department:"Lynch School of Education and Human Development",url:"https://www.bc.edu/bc-web/schools/lynch-school/academics/departments/counseling-developmental-educational-psychology/graduate-programs/measurement-evaluation-statistics-assessment.html"},
      {school:"Ohio State University",overall:"41",programRank:"Statistics Top 25",program:"PhD in Statistics",department:"Department of Statistics",url:"https://stat.osu.edu/grad/phd-program"},
      {school:"Ohio State University",overall:"41",programRank:"Quant Psych Top 10",program:"PhD in Quantitative Psychology",department:"Department of Psychology",url:"https://psychology.osu.edu/graduate-program/areas-study/quantitative-psychology"},
      {school:"Rutgers University",overall:"41",programRank:"Statistics Top 25",program:"PhD in Statistics",department:"Department of Statistics",url:"https://statistics.rutgers.edu/academics/graduate-program/ph-d-program"},
      {school:"Northeastern University",overall:"47",programRank:"Network Science Top",program:"PhD in Network Science",department:"Network Science Institute",url:"https://networkscience.northeastern.edu/academics/phd-program/"},
      {school:"Pennsylvania State University",overall:"47",programRank:"Statistics Top 20",program:"PhD in Statistics",department:"Department of Statistics",url:"https://science.psu.edu/stat/graduate/phd-statistics"},
      {school:"Pennsylvania State University",overall:"47",programRank:"Quant Methods Strong",program:"PhD in Educational Psychology (Quantitative Methods)",department:"College of Education",url:"https://ed.psu.edu/eps/educational-psychology/graduate-programs/quantitative-methods"},
      {school:"Rice University",overall:"18",programRank:"Behavioral Science Strong",program:"PhD in Psychological Sciences",department:"Department of Psychological Sciences",url:"https://psychology.rice.edu/graduate-program"},
      {school:"Georgetown University",overall:"24",programRank:"Political Methodology Strong",program:"PhD in Government",department:"Department of Government",url:"https://government.georgetown.edu/graduate/phd-program/"},
      {school:"Georgetown University",overall:"24",programRank:"Quant Psychology Strong",program:"PhD in Psychology",department:"Department of Psychology",url:"https://psychology.georgetown.edu/graduate/phd-program/"},
      {school:"Emory University",overall:"39",programRank:"Behavioral Research Strong",program:"PhD in Psychology",department:"Department of Psychology",url:"https://psychology.emory.edu/home/graduate/phd-program/index.html"},
      {school:"University of Notre Dame",overall:"18",programRank:"Quant Sociology Strong",program:"PhD in Sociology",department:"Department of Sociology",url:"https://sociology.nd.edu/graduate-program/"},
      {school:"George Mason University",overall:"109",programRank:"Computational Social Science Top",program:"PhD in Computational Social Science",department:"Department of Computational and Data Sciences",url:"https://science.gmu.edu/academics/departments-units/computational-data-sciences/computational-social-science-phd"},
      {school:"Texas A&M University",overall:"51",programRank:"Statistics Top 20",program:"PhD in Statistics",department:"Department of Statistics",url:"https://stat.tamu.edu/graduate/phd-statistics/"},
      {school:"Florida State University",overall:"54",programRank:"Statistics Strong",program:"PhD in Statistics",department:"Department of Statistics",url:"https://stat.fsu.edu/academics/graduate-program/phd-statistics"},
      {school:"University of Minnesota",overall:"54",programRank:"Statistics Top 25",program:"PhD in Statistics",department:"School of Statistics",url:"https://cse.umn.edu/stat/graduate/phd-statistics"},
      {school:"North Carolina State University",overall:"58",programRank:"Statistics Top 20",program:"PhD in Statistics",department:"Department of Statistics",url:"https://statistics.sciences.ncsu.edu/graduate/phd-statistics/"}
    ];

    const rows = document.getElementById('rows');
    const q = document.getElementById('q');
    const field = document.getElementById('field');
    const prank = document.getElementById('prank');
    const searchBtn = document.getElementById('searchBtn');

    function opts(id, values){
      id.innerHTML = '<option value="all">' + (id===field?'All Fields':'All Program Ranks') + '</option>' + [...new Set(values)].map(v=>`<option value="${v}">${v}</option>`).join('');
    }

    function row(item){
      return `<article class="db-row">
        <div class="db-cell"><span class="meta">${item.school}</span></div>
        <div class="db-cell"><span class="meta">${item.overall}</span></div>
        <div class="db-cell"><span class="meta">${item.programRank}</span></div>
        <div class="db-cell"><div class="project-title">${item.program}</div></div>
        <div class="db-cell"><span class="meta">${item.department}</span></div>
        <div class="db-cell"><a href="${item.url}" target="_blank" rel="noreferrer">${item.url}</a></div>
      </article>`;
    }

    function render(list){
      rows.innerHTML = list.length ? list.map(row).join('') : '<article class="db-row"><div class="db-cell" style="grid-column:1 / -1;">No matching entries.</div></article>';
    }

    function run(){
      const query = q.value.trim().toLowerCase();
      const t = field.value;
      const s = prank.value;
      const list = DB.filter(it => (t==='all'||it.programRank===t) && (s==='all'||it.overall===s) && (!query || [it.school,it.overall,it.programRank,it.program,it.department,it.url].join(' ').toLowerCase().includes(query)));
      render(list);
    }

    opts(field, DB.map(i=>i.programRank));
    opts(prank, DB.map(i=>i.overall));
    run();
    searchBtn.addEventListener('click', run);
    q.addEventListener('keydown', e=>{if(e.key==='Enter') run();});
    field.addEventListener('change', run);
    prank.addEventListener('change', run);
  </script>
  <script src="global-loader.js?v=20260526" defer></script>
</body>
</html>
